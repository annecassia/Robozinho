name: Robo Cacador de Ofertas 24h

on:
  schedule:
    # Roda automaticamente a cada 30 minutos na nuvem gratuita do GitHub
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  cacar_e_postar_oferta:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (requests, Pillow, dotenv)
        run: pip install -r requirements.txt

      - name: Executar Robo Cacador de Ofertas
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          MERCADOLIVRE_AFFILIATE_ID: ${{ secrets.MERCADOLIVRE_AFFILIATE_ID }}
          LINK_GRUPO_WHATSAPP: ${{ secrets.LINK_GRUPO_WHATSAPP }}
          WHATSAPP_ATIVO: ${{ secrets.WHATSAPP_ATIVO }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          FACEBOOK_ATIVO: ${{ secrets.FACEBOOK_ATIVO }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          PINTEREST_ATIVO: ${{ secrets.PINTEREST_ATIVO }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python main.py

      - name: Salvar historico de ofertas ja postadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/historico_postados.json || true
          git diff --staged --quiet || git commit -m "chore: atualiza historico de ofertas postadas"
          git push || true
