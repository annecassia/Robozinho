name: Robo Cacador de Ofertas 24h

on:
  schedule:
    # Roda automaticamente a cada 5 minutos na nuvem gratuita do GitHub (PC desligado)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  cacar_e_postar_oferta:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node.js 20 (Para o WhatsApp)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar dependencias Node
        run: npm install

      - name: Restaurar sessao do WhatsApp (se configurado)
        env:
          WHATSAPP_SESSION_B64: ${{ secrets.WHATSAPP_SESSION_B64 }}
        run: |
          if [ -n "$WHATSAPP_SESSION_B64" ]; then
            mkdir -p dados/sessao_whatsapp
            echo "$WHATSAPP_SESSION_B64" | base64 -d | tar -xz -C dados/sessao_whatsapp/
            echo "Sessao do WhatsApp restaurada com sucesso!"
          fi

      - name: Executar Robo Cacador de Ofertas
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          MERCADOLIVRE_AFFILIATE_ID: ${{ secrets.MERCADOLIVRE_AFFILIATE_ID }}
          SHOPEE_AFFILIATE_PARAMS: ${{ secrets.SHOPEE_AFFILIATE_PARAMS }}
          LOMADEE_APP_TOKEN: ${{ secrets.LOMADEE_APP_TOKEN }}
          LOMADEE_SOURCE_ID: ${{ secrets.LOMADEE_SOURCE_ID }}
          LINK_GRUPO_WHATSAPP: ${{ secrets.LINK_GRUPO_WHATSAPP }}
          DESCONTO_MINIMO_PERCENTUAL: ${{ secrets.DESCONTO_MINIMO_PERCENTUAL || '25' }}
          WHATSAPP_ATIVO: ${{ secrets.WHATSAPP_ATIVO || 'true' }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID || '120363412439180579@newsletter' }}
          FACEBOOK_ATIVO: ${{ secrets.FACEBOOK_ATIVO || 'true' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ATIVO: ${{ secrets.INSTAGRAM_ATIVO || 'true' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PINTEREST_ATIVO: ${{ secrets.PINTEREST_ATIVO || 'false' }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python main.py

      - name: Salvar historico de ofertas ja postadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/historico_postados.json dados/registro_envios_recentes.json dados/ultimo_estado_loja.json || true
          git diff --staged --quiet || git commit -m "chore: atualiza historico de ofertas postadas"
          git push || true
